name: Excel to Dashboard JSON

on:
  push:
    branches: [main]
    paths:
      - 'raw/**/*.xlsx'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update-dashboard.yml'
  workflow_dispatch:
  schedule:
    # 12:30 Asia/Taipei = 04:30 UTC
    - cron: '30 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fetch a fresh report on EVERY trigger, including code pushes.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: parts-dashboard-sync
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Download latest Google Drive daily Excel
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
        run: python scripts/download_google_drive.py --output-dir raw/daily

      - name: Build existing Dashboard JSON
        run: python scripts/build.py

      - name: Validate latest downloaded report and daily KPI JSON
        run: python scripts/validate_download.py

      # Save the original Excel only AFTER the dashboard data passes validation.
      # The generated JSON remains a Pages artifact, not a repository commit.
      - name: Commit validated daily Excel to GitHub
        shell: bash
        run: |
          set -euo pipefail
          git add -- 'raw/daily/*.xlsx'
          if git diff --cached --quiet; then
            echo 'Daily Excel already tracked with identical contents; no commit needed.'
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Archive validated daily Excel [skip ci]'
            git push origin HEAD:main
            echo 'Validated daily Excel committed to main.'
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
