
name: Excel to Dashboard JSON

on:
  push:
    branches: [main]
    paths:
      - 'raw/**/*.xlsx'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update-dashboard.yml'

  workflow_dispatch:
    inputs:
      download_daily:
        description: '從 Google Drive 下載最新日報並更新？'
        required: true
        type: choice
        default: 'yes'
        options:
          - 'no'
          - 'yes'

  schedule:
    # 台灣時間 12:45
    - cron: '45 4 * * *'
    # 台灣時間 13:15
    - cron: '15 5 * * *'

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.download_daily == 'yes') }}
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: parts-dashboard-sync
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Download latest Google Drive daily Excel
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.download_daily == 'yes') }}
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
        run: python scripts/download_google_drive.py --output-dir raw/daily

      - name: Build existing Dashboard JSON
        run: python scripts/build.py

      - name: Validate latest downloaded report and daily KPI JSON
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.download_daily == 'yes') }}
        run: python scripts/validate_download.py

      - name: Commit validated daily Excel to GitHub
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.download_daily == 'yes') }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- 'raw/daily/*.xlsx'

          if git diff --cached --quiet; then
            echo "No new Excel changes."
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'Archive validated daily Excel [skip ci]'

            git push origin HEAD:main
            echo "Daily Excel committed."
          fi

      - name: Check Dashboard files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -d data
          echo "Dashboard files are present."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: pages_upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: '.'
          retention-days: 1

      - name: Verify Pages artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "Checking Pages artifact: attempt $attempt"

            count=$(gh api \
              "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')

            if [ "$count" = "1" ]; then
              echo "Pages artifact verified."
              exit 0
            fi

            if [ "$count" -gt 1 ]; then
              echo "Error: Duplicate Pages artifacts."
              exit 1
            fi

            sleep 10
          done

          echo "Error: github-pages artifact not found."
          exit 1

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
