name: Excel to Dashboard JSON

on:
  push:
    paths:
      - 'raw/**/*.xlsx'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update-dashboard.yml'
  workflow_dispatch:
  schedule:
    # 12:30 Asia/Taipei = 04:30 UTC
  - cron: '30 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # All triggers must fetch today's report before rebuilding or deploying.
      # Missing/invalid report fails the job, preserving the last published Pages site.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: parts-dashboard-sync
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Download latest Google Drive daily Excel
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
        run: python scripts/download_google_drive.py --output-dir raw/daily

      - name: Build existing Dashboard JSON
        run: python scripts/build.py

      - name: Validate latest downloaded report and daily KPI JSON
        run: python scripts/validate_download.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
